name: MirrorFly Messages API
description: >-
  MirrorFly is a self-hosted CPaaS from CONTUS TECH (Chennai, India) that lets teams embed
  real-time chat, messaging, HD voice, video calling, live streaming, SIP/VoIP and activity
  feeds into web and mobile applications, deployed either on MirrorFly's cloud or entirely
  on the customer's own infrastructure. The developer surface has two halves: multi-platform
  client SDKs and prebuilt UIKits for JavaScript, React, React Native, Angular, Vue, Flutter,
  Kotlin/Android, Swift/iOS and Objective-C; and a server-side REST Chat Platform API split
  into User APIs and Admin APIs covering users, contacts, presence, one-to-one and group
  chat, topics, message history, media, moderation (block/unblock), data migration and data
  export. Authentication mints a one-hour token from a console-issued username and password.
  MirrorFly also ships conversational-AI tooling — AI voice agents, chatbots, speech-to-text
  and an AI contact center — on the same platform.
