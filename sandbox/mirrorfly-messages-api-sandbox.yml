generated: '2026-08-09'
method: searched
source: >-
  https://www.mirrorfly.com/docs/platformapi/ (base URL guidance) plus live probe of
  https://api-preprod-sandbox.mirrorfly.com/, 2026-08-09
summary: >-
  MirrorFly runs a public preprod sandbox host for the Chat Platform API. The host is
  reachable and live (it answers with a real Spring Boot JSON error envelope and exposes
  /actuator), but it is NOT anonymously usable: every operation still requires a token
  minted from POST /api/v1/login with credentials issued through the MirrorFly console.
  MirrorFly publishes no magic/test identifiers, no test credentials, and no fixture or
  trigger tooling.
environments:
  - name: preprod-sandbox
    base_url: https://api-preprod-sandbox.mirrorfly.com/api/v1/
    public_host: true
    credentials_required: true
    self_service_credentials: false
    probe:
      url: https://api-preprod-sandbox.mirrorfly.com/api/v1/
      status: 404
      body_shape: '{"timestamp":"...","path":"...","status":404,"error":"Not Found"}'
      note: >-
        A real JSON 404 from the origin (not a soft-404) — the host is live; there is no
        unauthenticated index or discovery route.
  - name: production
    base_url: https://{api-base-url}/api/v1/
    public_host: false
    note: >-
      The production base URL is tenant-specific and issued in the console after server
      configuration; there is no shared production hostname.
test_data:
  test_credentials_published: false
  magic_identifiers: []
  test_clock: false
  fixtures: false
  triggers: false
  note: >-
    Nothing test-mode-specific is published — no test user IDs, no seeded groups, no
    simulator values. Sandbox access starts with a credential request.
credential_path:
  console: https://console.mirrorfly.com/
  request: https://www.mirrorfly.com/contact-sales.php
  turnaround: >-
    "Registration is subject to verification and would take up to 24 hours" (published
    on the Get Started / Login pages).
observability:
  actuator:
    url: https://api-preprod-sandbox.mirrorfly.com/actuator
    status: 200
    exposed: [self, health, 'health/{*path}']
    note: >-
      The sandbox exposes a Spring Boot Actuator discovery document anonymously. Only
      health endpoints are linked; recorded as observed platform detail, not as a
      documented MirrorFly feature.
