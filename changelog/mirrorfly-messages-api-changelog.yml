note: >-
  MirrorFly publishes a real, maintained API changelog for the Chat Platform API, but the
  entries carry no dates and no breaking-change markers — only version headings with
  "New Features" bullets. Recorded verbatim from the published page; recent window only.
  Nothing is inferred about release dates.
entries:
  - version: 2.1.9
    breaking: unstated
    additions:
      - Group — new APIs to initiate a group deletion job and track its status.
  - version: 2.1.8
    breaking: unstated
    additions:
      - Chat — new APIs to get chat info by chatId and topicId.
  - version: 2.1.7
    breaking: unstated
    additions:
      - Chat — new APIs for chat recent and chat conversations for admin monitoring.
      - Topic — URL changes in the topic-based chat APIs.
  - version: 2.1.6
    breaking: unstated
    additions:
      - Topic — new APIs for admin recent chat and chat history.
  - version: 2.1.5
    breaking: unstated
    additions:
      - Chat — new APIs for chat archive, unarchive, and fetching the archived chat list.
      - Chat — new param 'messageTime' in the recent chat API to fetch chats after a given epoch timestamp.
      - Chat — new param 'messageId' in the send message API to edit a sent message.
  - version: 2.1.4
    breaking: unstated
    additions:
      - User — Create User API 'email' param now accepts special characters (!#$%&+).
      - Chat — Create topic API adds a license key param associated with topics.
      - Chat — new API to retrieve topics associated with the current user license key and optionally a specified User ID.
  - version: 2.1.3
    breaking: unstated
    additions:
      - User — new API to fetch the blocked-by users list.
      - User — new APIs to fetch call logs and create a room.
      - Group — new param 'metaData' adding 3 more meta entries in create and update APIs.
      - Group — metaData added to getGroupList and groupDetails responses.
  - version: 2.1.2
    breaking: unstated
    additions:
      - User — new APIs to block/unblock a user.
      - Chat — new API to get the unread message count.
      - Chat — new param 'exclude' to exclude specific message types in the recent chat API.
  - version: 2.1.1
    breaking: unstated
    additions:
      - Admin — new API to reset a user password.
      - Chat — isLargeFile param added to the media object in recent and history responses.
      - Chat — auto_text message type handled in recent and history responses.
  - version: 2.1.0
    breaking: unstated
    additions:
      - Chat — new API to create topics; new API to fetch topics data.
      - Chat — topicId introduced in the sendMessage API and in recent/history search and responses.
      - User — APIs to fetch and update the logged-in user metadata.
      - Admin — APIs to fetch and update user metadata.
  - version: 2.0.0
    breaking: unstated
    additions:
      - User — new API to fetch the blocked users list.
  - version: 1.9.0
    breaking: unstated
    additions:
      - Chat — mentions support in the send message API via message/caption inputs.
      - Chat — total count added to the chat history response.
      - Group — license key filter in create, update and get group list APIs.
      - Group — isAdmin param in the get group members response.
      - Admin — licenseKey param in the usersList API.
  - version: 1.8.0
    breaking: unstated
    additions:
      - Group — leave group and delete group APIs introduced.
history_extends_to: 1.0.0
